# docker-compose.prod.yml
# Production stack for EC2. Pulls pre-built images from GHCR instead of
# building locally (that happens in CI). Deployed via `docker compose`
# using the override file pattern:
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Required on the host, in a .env file next to this compose file:
#   GHCR_OWNER   - your GitHub username/org, lowercase (image namespace)
#   IMAGE_TAG    - image tag to deploy, e.g. "latest" or a short commit SHA
#   MONGO_INITDB_ROOT_USERNAME
#   MONGO_INITDB_ROOT_PASSWORD
#
# If the GHCR packages are private, run `docker login ghcr.io` once on the
# host before the first `docker compose pull` (see deploy/README.md).

services:

  mongo:
    image: mongo:7.0.12
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: sentinel
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: >
        mongosh --quiet
        --username $$MONGO_INITDB_ROOT_USERNAME
        --password $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand({ ping: 1 })"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_OWNER}/devops-sentinel-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/sentinel?authSource=admin
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: ghcr.io/${GHCR_OWNER}/devops-sentinel-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mongo_data:
    driver: local
