# nginx.conf
# Serves the React SPA and proxies /api requests to the backend container.
# The backend service is named "backend" in docker-compose.yml.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compress text responses.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Do not expose the nginx version in error pages or headers.
    server_tokens off;

    # Log format: structured, one line per request.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Proxy all /api requests to the backend container.
        # "backend" resolves via Docker's internal DNS to the backend service.
        location /api/ {
            proxy_pass         http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts: backend should respond quickly for this simple app.
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Proxy the health endpoint so integration tests can reach it from port 80.
        location /health {
            proxy_pass         http://backend:3000/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # For any path that is not a file, serve index.html so React Router works.
        # (No router in Step 1, but this is the correct SPA default.)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
