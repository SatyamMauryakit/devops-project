apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sentinel
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-sentinel
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    # Load alert rules from the mounted rules ConfigMap.
    # The Prometheus Deployment mounts prometheus-rules ConfigMap at /etc/prometheus/rules/.
    rule_files:
      - /etc/prometheus/rules/*.yaml

    # Send firing alerts to Alertmanager.
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:

      # Scrape the OTel Collector's application metrics endpoint.
      # This is where backend HTTP/Mongoose metrics land after passing through
      # the collector's prometheus exporter.
      - job_name: "otelcol-app"
        static_configs:
          - targets: ["otelcol:8889"]

      # Scrape the OTel Collector's own internal health metrics.
      - job_name: "otelcol-self"
        static_configs:
          - targets: ["otelcol:8888"]

      # Scrape Kubernetes pod metrics using the Kubernetes service discovery API.
      # Any pod with the annotation prometheus.io/scrape: "true" is picked up.
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["sentinel"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
