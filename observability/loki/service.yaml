apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: sentinel
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: devops-sentinel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
    - name: grpc
      port: 9096
      targetPort: 9096
      protocol: TCP
