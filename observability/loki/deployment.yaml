apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: sentinel
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: devops-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: devops-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: loki
          image: grafana/loki:3.1.0
          imagePullPolicy: IfNotPresent

          args:
            - "-config.file=/etc/loki/loki.yaml"

          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            # Loki writes chunks, index, and WAL under /loki.
            - name: data
              mountPath: /loki

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"

          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}    # ephemeral for local dev; use PVC for staging+
