apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: sentinel
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: devops-sentinel
data:
  tempo.yaml: |
    # Tempo single-binary configuration for local development.
    # Receives traces via OTLP gRPC and stores them on the local filesystem.

    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: warn

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 24h

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: kind-sentinel
      storage:
        path: /var/tempo/generator/wal

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
          storage:
            remote_write:
              - url: http://prometheus:9090/api/v1/write
                send_exemplars: true
