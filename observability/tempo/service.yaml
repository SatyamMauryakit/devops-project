apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: sentinel
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: devops-sentinel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
    # The OTel Collector forwards traces to this port.
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
