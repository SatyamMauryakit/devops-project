apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: sentinel
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: devops-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: devops-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: tempo
          image: grafana/tempo:2.5.0
          imagePullPolicy: IfNotPresent

          args:
            - "-config.file=/etc/tempo/tempo.yaml"

          ports:
            - name: http
              containerPort: 3200
            - name: grpc
              containerPort: 9095
            # OTLP gRPC receiver — the OTel Collector sends traces here.
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            # Tempo writes traces, WAL, and metrics-generator data under /var/tempo.
            - name: data
              mountPath: /var/tempo

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}    # ephemeral for local dev; use PVC for staging+
