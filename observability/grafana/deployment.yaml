apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sentinel
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: devops-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: devops-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        # grafana/grafana image uses uid 472.
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          env:
            # Disable login for local development so the dashboard is
            # accessible immediately without credentials.
            # Change this to "false" and set GF_SECURITY_ADMIN_PASSWORD
            # via a Secret for any shared or production environment.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:3000"
            # Suppress the "Install plugins" banner.
            - name: GF_INSTALL_PLUGINS
              value: ""

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards-json
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            # Grafana writes its SQLite database and plugin cache here.
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
            items:
              - key: provider.yaml
                path: provider.yaml
        - name: dashboards-json
          configMap:
            name: grafana-dashboards-json
        - name: grafana-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
