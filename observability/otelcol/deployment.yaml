apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol
  namespace: sentinel
  labels:
    app.kubernetes.io/name: otelcol
    app.kubernetes.io/part-of: devops-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcol
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otelcol
        app.kubernetes.io/part-of: devops-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: otelcol
          # contrib image includes the Loki and Prometheus exporters.
          # core image does not.
          image: otel/opentelemetry-collector-contrib:0.103.0
          imagePullPolicy: IfNotPresent

          args:
            - "--config=/etc/otelcol/config.yaml"

          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            # Collector's own Prometheus metrics endpoint.
            - name: metrics-self
              containerPort: 8888
            # Application metrics scrape endpoint exposed to Prometheus.
            - name: metrics-app
              containerPort: 8889

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 13133      # OTel Collector health check extension default port
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: otelcol-config
        - name: tmp
          emptyDir: {}
