# agent/k8s/secret.yaml
#
# IMPORTANT: All values below are base64-encoded placeholders.
# base64("placeholder") = cGxhY2Vob2xkZXI=
#
# Apply real values with kubectl — never commit them:
#
#   kubectl create secret generic agent-secrets \
#     --namespace sentinel \
#     --from-literal=GROQ_API_KEY="gsk_..." \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# If using Ollama (no API key needed), this secret can be left as-is.
# The agent will use GROQ_API_KEY only when LLM_PROVIDER=groq.

apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: sentinel
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: devops-sentinel
type: Opaque
data:
  GROQ_API_KEY: cGxhY2Vob2xkZXI=
