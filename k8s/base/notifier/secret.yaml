# notifier/secret.yaml
#
# IMPORTANT: This file contains ONLY placeholder values.
# Never replace the placeholders with real tokens and commit this file.
#
# Apply real values with kubectl directly (they never touch git):
#
#   kubectl create secret generic notifier-secrets \
#     --namespace sentinel \
#     --from-literal=SLACK_WEBHOOK_URL="https://hooks.slack.com/services/..." \
#     --from-literal=WHATSAPP_ACCESS_TOKEN="your-token" \
#     --from-literal=WHATSAPP_PHONE_NUMBER_ID="123456789012345" \
#     --from-literal=WHATSAPP_RECIPIENT_NUMBER="+12025550123" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The base64 values below are encodings of the literal string "placeholder".
# They exist only so kustomize can render the manifest without errors.
# Replace them before any real deployment using the command above.

apiVersion: v1
kind: Secret
metadata:
  name: notifier-secrets
  namespace: sentinel
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: devops-sentinel
type: Opaque
data:
  # base64("placeholder") = cGxhY2Vob2xkZXI=
  SLACK_WEBHOOK_URL:          cGxhY2Vob2xkZXI=
  WHATSAPP_ACCESS_TOKEN:      cGxhY2Vob2xkZXI=
  WHATSAPP_PHONE_NUMBER_ID:   cGxhY2Vob2xkZXI=
  WHATSAPP_RECIPIENT_NUMBER:  cGxhY2Vob2xkZXI=
