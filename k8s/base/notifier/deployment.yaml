apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: sentinel
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/part-of: devops-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/part-of: devops-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532      # distroless/static:nonroot UID
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 15

      containers:
        - name: notifier
          # The overlay patches this to the real image name after it is built.
          image: devops-sentinel-notifier:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: WHATSAPP_TEMPLATE_NAME
              value: "sentinel_alert"
            - name: WHATSAPP_TEMPLATE_LANG
              value: "en_US"
            # Secret values injected from the notifier-secrets Secret.
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: notifier-secrets
                  key: SLACK_WEBHOOK_URL
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notifier-secrets
                  key: WHATSAPP_ACCESS_TOKEN
            - name: WHATSAPP_PHONE_NUMBER_ID
              valueFrom:
                secretKeyRef:
                  name: notifier-secrets
                  key: WHATSAPP_PHONE_NUMBER_ID
            - name: WHATSAPP_RECIPIENT_NUMBER
              valueFrom:
                secretKeyRef:
                  name: notifier-secrets
                  key: WHATSAPP_RECIPIENT_NUMBER

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
