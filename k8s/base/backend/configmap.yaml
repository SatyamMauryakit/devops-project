apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: sentinel
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: devops-sentinel
data:
  # Non-secret runtime configuration.
  # The MONGO_URI is constructed in the Deployment from ConfigMap + Secret values
  # so the password never appears in the ConfigMap.
  PORT: "3000"
  NODE_ENV: "production"
  # Mongo host and database — no credentials here.
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  MONGO_DB: "sentinel"
  MONGO_AUTH_SOURCE: "admin"
