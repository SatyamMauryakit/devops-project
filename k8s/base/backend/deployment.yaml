apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sentinel
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: devops-sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  # RollingUpdate ensures at least one pod stays up during a deployment.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: devops-sentinel
    spec:
      # ---------------------------------------------------------------------------
      # Security context for the Pod
      # ---------------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001          # matches the "appuser" created in the backend Dockerfile
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 30

      containers:
        - name: backend
          # The overlay patches this image name/tag for each environment.
          # The base uses the local image name from docker compose.
          image: devops-project-1-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
              name: http

          # ---------------------------------------------------------------------------
          # Environment variables
          # Non-secret values come from the ConfigMap.
          # Secret values come from the Secret.
          # MONGO_URI is assembled from both so the password is never in plaintext
          # in any non-Secret manifest.
          # ---------------------------------------------------------------------------
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: NODE_ENV
            # Assemble MONGO_URI from parts so the password stays in the Secret.
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGO_PORT
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGO_DB
            - name: MONGO_AUTH_SOURCE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MONGO_AUTH_SOURCE
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DB)?authSource=$(MONGO_AUTH_SOURCE)"

          # ---------------------------------------------------------------------------
          # Security context for the container
          # ---------------------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          # Node.js needs a writable /tmp for some internal operations.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # ---------------------------------------------------------------------------
          # Resource limits
          # ---------------------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # ---------------------------------------------------------------------------
          # Probes
          #
          # Liveness probe: answers "is this container alive?"
          #   If it fails, Kubernetes kills the container and restarts it.
          #   Use it to detect deadlocks or unrecoverable states.
          #   A stricter failure threshold avoids restarting a pod that is simply
          #   waiting for MongoDB to start.
          #
          # Readiness probe: answers "is this container ready to serve traffic?"
          #   If it fails, Kubernetes removes the pod from the Service endpoints
          #   but does NOT restart it. Traffic stops going to it until it recovers.
          #   Use it to hold traffic back during startup or temporary unavailability.
          # ---------------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir: {}
