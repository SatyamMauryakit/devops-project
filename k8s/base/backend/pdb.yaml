apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: sentinel
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: devops-sentinel
spec:
  # With 2 replicas, minAvailable: 1 ensures at least one pod is always
  # running during voluntary disruptions such as node drains or rolling updates.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
