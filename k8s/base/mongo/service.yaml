apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: sentinel
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: devops-sentinel
spec:
  # ClusterNone (headless) is the standard pattern for StatefulSets.
  # It creates a DNS A record per pod (mongo-0.mongo.sentinel.svc.cluster.local)
  # rather than a single load-balanced virtual IP.
  # The backend connects via the stable DNS name "mongo" which resolves
  # to the single pod in our single-replica setup.
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
      protocol: TCP
