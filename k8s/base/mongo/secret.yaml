# mongo/secret.yaml
#
# IMPORTANT: The values below are base64-encoded PLACEHOLDERS.
# "admin" encodes to "YWRtaW4="
# "changeme" encodes to "Y2hhbmdlbWU="
#
# Never replace these with real credentials and commit the file.
# For a real environment, generate the secret outside git:
#
#   kubectl create secret generic mongo-credentials \
#     --namespace sentinel \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=<real-user> \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD=<real-password> \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or use Sealed Secrets / External Secrets Operator (added in a later step).

apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: sentinel
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: devops-sentinel
type: Opaque
data:
  # base64 of "admin"
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=
  # base64 of "changeme" - replace before any real deployment
  MONGO_INITDB_ROOT_PASSWORD: Y2hhbmdlbWU=
