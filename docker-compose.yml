# docker-compose.yml
# Local development stack for DevOps Sentinel.
#
# Services:
#   mongo    - MongoDB 7.0 with a named volume for data persistence.
#   backend  - Express API; waits for mongo to be healthy before starting.
#   frontend - React SPA served by nginx; proxies /api to the backend.
#
# Usage:
#   cp .env.example .env          # fill in credentials once
#   docker compose up --build     # first run
#   docker compose up             # subsequent runs (no rebuild needed)
#   docker compose down           # stop and remove containers (data volume survives)
#   docker compose down -v        # also remove the data volume (data is lost)

services:

  # ---------------------------------------------------------------------------
  # MongoDB 7.0
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0.12
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: sentinel
    volumes:
      - mongo_data:/data/db
    # MongoDB does not expose a port to the host by default.
    # Only the backend container (on the same network) needs access.
    expose:
      - "27017"
    healthcheck:
      # mongosh exits 0 when the server is ready to accept connections.
      test: >
        mongosh --quiet
        --username $$MONGO_INITDB_ROOT_USERNAME
        --password $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand({ ping: 1 })"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend (Express)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Credentials come from the root .env file (never hardcoded here).
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/sentinel?authSource=admin
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend (nginx serving the React build)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # The only externally exposed port in the entire stack.
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  mongo_data:
    driver: local
